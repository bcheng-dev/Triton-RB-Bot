name = "rb-checkin"
main = "src/index.js"
compatibility_date = "2026-05-01"
# Ed25519 in WebCrypto and modern fetch semantics.
compatibility_flags = ["nodejs_compat"]

# Everything secret goes in with `wrangler secret put`, never here:
#   DISCORD_PUBLIC_KEY, DISCORD_APP_ID, DISCORD_BOT_TOKEN,
#   SHEET_ID, GOOGLE_CREDENTIALS
#
# Non-secret settings can live here. Match them to your sheet.
[vars]
TIMEZONE = "America/Los_Angeles"
# The signup form's response tab. One form serves every event.
SIGNUP_TAB = "TRN Signups"
# The form question where people pick their event date. Signups are matched to the
# event by the date in this answer. Several headers, split by |, are all checked.
COL_EVENT = "Which event are you signing up for?|Which Event are you signing up for?|Which event(date) are you signing up for?"
# What the panel's Sign up button and the bot's replies link to.
SIGNUP_FORM_URL = "https://forms.gle/9BzLFsZWjzffJP4WA"
# What the panel's Feedback button opens.
FEEDBACK_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSezV251wrUoGkgA849IctE0xLvoyfxPUApRPx1vWSe1jjKwdQ/viewform"
# What the panel's Rankings button opens.
RANKINGS_URL = "https://bcheng-dev.github.io/TNN-Standings/"
# The Triton MMR sheet (public, view only). /nexus reads its Nexus Ledger tab.
MMR_SHEET_ID = "1dbezzcgyLVsv_yz_8CfBQmcrI_2_u9AjZ5hjyAaqIRo"
# The bot's own log. Not "Attendance": that name is taken by an older form's tab.
ATTENDANCE_TAB = "Check-in Log"
# The schedule /event-add writes to, one row per event.
EVENTS_TAB = "Events"
CHECKIN_OPENS_MINUTES = "30"
# Header text as the sheet has it, minus leading/trailing spaces (the bot trims them).
COL_NAME = "What is your FULL NAME?"
COL_DISCORD = "What is your Discord username?"
COL_VERIFIED_ID = "Discord ID (verified)"
COL_CHECKED = "Checked in"
# Who may use organizer commands: the Officer role's ID. That role and every role
# ranked above it count; being an administrator does not. Comma separate one
# ID per server if the bot is in several. Empty means Manage Events or Manage Server.
ORGANIZER_ROLE_IDS = "1563770017969995827"
# Only members holding one of these roles may use slash commands; administrators need
# the role too. Buttons on a posted panel work for everyone. Empty opens commands to all.
REQUIRED_ROLE_IDS = "1563770017969995827"
# "true" lets every member see and use /panel; "false" keeps it officers-only.
PANEL_FOR_EVERYONE = "false"
# "true" pauses the bot: every button and command gets a short "paused" reply and
# nothing else happens. "false" is normal service.
BOT_PAUSED = "false"
